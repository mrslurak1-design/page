<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html b:version='2' class='v2' expr:dir='data:blog.languageDirection' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
    <meta charset='UTF-8'/>
    <meta content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover' name='viewport'/>
    <title id='page-title'><data:blog.pageTitle/></title>
    
    <b:skin><![CDATA[
        /* -- CSS Styling untuk Pemutar Video Vertikal (TikTok/Reels Style) -- */
        :root {
            --primary: #e60023;
            --bg-color: #000;
            --text-color: #fff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* Sembunyikan elemen bawaan Blogger yang tidak diperlukan */
        .navbar, .blogger-iframe-colorize, iframe.gemini-iframe { display: none !important; }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            position: fixed;
        }

        /* Navigasi Kategori di Atas */
        .nav-cat {
            position: fixed;
            top: 15px;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 8px;
            pointer-events: auto;
        }
        .nav-cat a {
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.2s;
        }
        .nav-cat a.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        /* Container Reel */
        #reel-container {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        #reel-container::-webkit-scrollbar { display: none; }

        /* Item Video */
        .reel-item {
            width: 100%;
            height: 100%;
            height: 100dvh;
            scroll-snap-align: start;
            position: relative;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reel-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Overlay & Informasi di Bawah */
        .reel-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
            z-index: 10;
            pointer-events: none;
        }
        .reel-overlay * { pointer-events: auto; }

        .reel-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Tombol Aksi Samping (Kanan) */
        .reel-actions {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 15;
        }
        .action-btn {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            border: none;
            color: #fff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            text-decoration: none;
        }

        /* Pesan Loading / Error */
        #loading-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 14px;
            color: #aaa;
            z-index: 5;
        }
    ]]></b:skin>
</head>
<body>

    <!-- Navigasi Kategori Berdasarkan Parameter URL -->
    <div class='nav-cat'>
        <a expr:class='!blog.url.params.cat || blog.url.params.cat == &quot;indo&quot; ? &quot;active&quot; : &quot;&quot;' href='?cat=indo'>Indo</a>
        <a expr:class='blog.url.params.cat == &quot;barat&quot; ? &quot;active&quot; : &quot;&quot;' href='?cat=barat'>Barat</a>
        <a expr:class='blog.url.params.cat == &quot;hd&quot; ? &quot;active&quot; : &quot;&quot;' href='?cat=hd'>HD</a>
    </div>

    <div id='loading-state'>Memuat video...</div>

    <!-- Container Utama Pemutar Video -->
    <div id='reel-container'></div>

    <!-- Widget Utama Blogger yang disederhanakan -->
    <b:section class='main' id='main-section' showaddelement='no'>
      <b:widget id='Blog1' locked='true' title='Blog Posts' type='Blog'>
        <b:includable id='main'>
          <!-- Konten otomatis ditangani oleh engine JavaScript di bawah -->
        </b:includable>
      </b:widget>
    </b:section>

    <!-- Skrip Pemroses CSV & Pemutar Video -->
    <script>
    <![CDATA[
        // Konfigurasi Database Kategori
        const categories = {
            'indo': { file: 'https://raw.githubusercontent.com/adisd321-hub/database-video/main/data.csv', title: 'Video Pemersatu Bangsa Indo' },
            'barat': { file: 'https://raw.githubusercontent.com/adisd321-hub/database-video/main/data2.csv', title: 'Koleksi Video Barat Pemersatu Bangsa' },
            'hd': { file: 'https://raw.githubusercontent.com/adisd321-hub/database-video/main/data3.csv', title: 'Koleksi Video HD Pemersatu Bangsa' }
        };

        // Ambil parameter kategori dari URL (?cat=...)
        const urlParams = new URLSearchParams(window.location.search);
        const currentCat = urlParams.get('cat') || 'indo';
        const selectedConfig = categories[currentCat] || categories['indo'];

        // Ubah judul halaman secara dinamis sesuai kategori
        document.title = selectedConfig.title;

        async function loadVideos() {
            try {
                const response = await fetch(selectedConfig.file);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                document.getElementById('loading-state').innerText = 'Gagal memuat data video.';
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const container = document.getElementById('reel-container');
            document.getElementById('loading-state').style.display = 'none';

            lines.forEach((line) => {
                if (!line.trim()) return;
                // Asumsi format CSV: Kolom 1 = Judul, Kolom 2 = Link Video
                const parts = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                if (parts.length >= 2) {
                    let title = parts[0].replace(/^"(.*)"$/, '$1').trim();
                    let videoUrl = parts[1].replace(/^"(.*)"$/, '$1').trim();

                    if(videoUrl.startsWith('http')) {
                        createReelItem(container, title, videoUrl);
                    }
                }
            });
        }

        function createReelItem(container, title, videoUrl) {
            const item = document.createElement('div');
            item.className = 'reel-item';

            item.innerHTML = `
                <video src="${videoUrl}" playsinline="true" webkit-playsinline="true" preload="metadata" loop="true"></video>
                <div class='reel-actions'>
                    <button class='action-btn' onclick='shareVideo(this)'>🔗</button>
                </div>
                <div class='reel-overlay'>
                    <div class='reel-title'>${title}</div>
                </div>
            `;

            const video = item.querySelector('video');
            
            // Klik untuk Play/Pause
            item.addEventListener('click', () => {
                if (video.paused) {
                    video.play();
                } else {
                    video.pause();
                }
            });

            container.appendChild(item);
        }

        // Observer agar video otomatis play saat masuk layar & pause saat keluar
        const observerOptions = {
            root: document.getElementById('reel-container'),
            threshold: 0.6
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play().catch(e => console.log("Autoplay dicegah browser"));
                } else {
                    video.pause();
                    video.currentTime = 0;
                }
            });
        }, observerOptions);

        // Jalankan setelah elemen selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            loadVideos().then(() => {
                setTimeout(() => {
                    document.querySelectorAll('.reel-item').forEach(item => {
                        observer.observe(item);
                    });
                }, 500);
            });
        });

        function shareVideo(btn) {
            const video = btn.closest('.reel-item').querySelector('video');
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: video.src
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(video.src);
                alert('Link video disalin!');
            }
        }
    ]]>
    </script>
</body>
</html>
